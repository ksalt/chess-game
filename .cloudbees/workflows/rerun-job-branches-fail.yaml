apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: rerun-job-branches-fail
on:
  workflow_dispatch:
jobs:
  setup:
    steps:
      - name: Run setup
        uses: docker://alpine:3.20
        shell: sh
        run: echo "setup running"
  left-1:
    needs: setup
    steps: 
      - name: Run left-1
        uses: docker://alpine:3.20
        shell: sh
        run: echo "left-1 running"
  left-2:
    needs: left-1
    steps: 
      - name: Run left-2
        uses: docker://alpine:3.20
        shell: sh
        run: echo "left-2 running"
  right-1:
    needs: setup
    steps: 
      - name: Run right-1
        uses: docker://alpine:3.20
        shell: sh
        run: echo "right-1 failing" && exit 1
  right-2:
    needs: right-1
    steps:
      - name: Run right-2
        uses: docker://alpine:3.20
        shell: sh
        run: echo "right-2 running"
  merge:
    needs: [left-2, right-2]
    steps:
      - name: Run merge
        uses: docker://alpine:3.20
        shell: sh
        run: echo "merge running"
  lone:
    steps:
      - name: Run lone
        uses: docker://alpine:3.20
        shell: sh
        run: echo "lone running"